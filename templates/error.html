<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="color-scheme" content="dark light">
    <title>{{ error_title }} · Stats</title>
    <style>
        :root { color-scheme: dark; --bg:#0b1219; --panel:#141e28; --text:#f1f6fa; --muted:#a8b7c5; --line:#2b3947; --accent:#6ee7c0; }
        @media (prefers-color-scheme:light) { :root { color-scheme:light; --bg:#f1f5f7; --panel:#fff; --text:#152635; --muted:#526575; --line:#dce5ea; --accent:#087d60; } }
        * { box-sizing:border-box; }
        body { margin:0; min-height:100vh; min-height:100svh; display:grid; place-items:center; padding:24px; background:var(--bg); color:var(--text); font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
        main { width:100%; max-width:480px; padding:40px 32px 28px; border:1px solid var(--line); border-radius:24px; background:var(--panel); box-shadow:0 24px 80px #0002; }
        .brand { font-size:12px; font-weight:750; letter-spacing:.16em; color:var(--muted); text-transform:uppercase; }
        .court { position:relative; height:120px; margin:32px 0; border:1px solid var(--line); border-radius:12px; overflow:hidden; background:linear-gradient(120deg,transparent,#6ee7c00b); }
        .court::before { content:""; position:absolute; inset:0 50% 0 auto; border-left:1px dashed var(--muted); }
        .court::after { content:""; position:absolute; width:32px; height:32px; top:44px; left:calc(50% - 16px); border:2px solid var(--accent); border-radius:50%; background:var(--panel); box-shadow:0 0 0 10px var(--panel); }
        .status { color:var(--accent); font-size:12px; font-weight:700; letter-spacing:.1em; text-transform:uppercase; }
        h1 { font-size:clamp(26px,6vw,34px); letter-spacing:-.04em; line-height:1.15; margin:12px 0; }
        p { color:var(--muted); font-size:16px; line-height:1.6; margin:0 0 28px; }
        .actions { display:flex; flex-wrap:wrap; gap:10px; }
        a,button { display:inline-flex; align-items:center; justify-content:center; min-height:48px; padding:12px 18px; border:1px solid var(--line); border-radius:12px; color:var(--text); background:transparent; font:600 14px system-ui; text-decoration:none; cursor:pointer; }
        .primary { background:var(--accent); color:var(--bg); border-color:var(--accent); }
        a:hover,button:hover { filter:brightness(1.1); }
        a:focus-visible,button:focus-visible { outline:3px solid var(--accent); outline-offset:4px; }
        footer { margin-top:28px; padding-top:20px; border-top:1px solid var(--line); color:var(--muted); font-size:12px; }
        @media(max-width:400px) { main { padding:28px 22px 24px; } .actions>* { flex:1; } }
    </style>
</head>
<body>
    <main aria-labelledby="error-title">
        <div class="brand">KT Stats</div>
        <div class="court" aria-hidden="true"></div>
        <div class="status">{{ error_call }}</div>
        <h1 id="error-title">{{ error_title }}</h1>
        <p>{{ error_message }}</p>
        <div class="actions">
            {% if error_code >= 500 %}
            <button class="primary" type="button" onclick="window.location.replace(window.location.href)">Try again</button>
            <a href="/">Back to Stats</a>
            {% else %}
            <a class="primary" href="/">Back to Stats</a>
            {% if error_code == 403 %}<a href="/login">Sign in</a>{% endif %}
            {% endif %}
        </div>
        <footer>Stats · Error {{ error_code }}</footer>
    </main>
</body>
</html>
