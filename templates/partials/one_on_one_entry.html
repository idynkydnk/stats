<div style="margin-bottom:16px">
    <label for="one-on-one-entry">1v1 volleyball format</label>
    <select id="one-on-one-entry" style="width:100%" onchange="window.location.href=this.value">
        {% for name in one_on_one_formats %}
        <option value="{{ url_for('add_vollis_game') if name == 'Vollis' else url_for('add_other_game', one_on_one='1', format=name) }}" {% if name == request.args.get('format', 'Vollis') %}selected{% endif %}>{{ name }}</option>
        {% endfor %}
    </select>
</div>
