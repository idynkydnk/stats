{% set entry_format = 'Vollis' if request.endpoint == 'add_vollis_game' else request.args.get('format', '') %}
<div class="autocomplete has-clear{% if not entry_format %} empty{% endif %}" id="game_name-wrap">
    <input type="text" name="game_name" id="game_name" value="{{ entry_format }}" placeholder="Volleyball Format" aria-label="Volleyball Format" autocomplete="off" required>
    <button type="button" class="clear-field-btn" title="Clear" aria-label="Clear volleyball format"><i class="fas fa-times"></i></button>
    <div class="autocomplete-list" id="game_nameList"></div>
</div>
