{% if ai_summary_progress_job %}
<div class="sr-card" style="padding: 12px 16px; margin-bottom: 16px;" role="status" aria-live="polite">
    <i id="recap-progress-icon" class="fas fa-spinner fa-spin" aria-hidden="true"></i>
    <span id="recap-progress-text">Generating your recap in the background…</span>
    <a id="recap-progress-link" hidden>Open recap</a>
</div>
<script>
(function () {
    var job = {{ ai_summary_progress_job|tojson }};
    var text = document.getElementById('recap-progress-text');
    var icon = document.getElementById('recap-progress-icon');
    var link = document.getElementById('recap-progress-link');
    function update(data) {
        if (data.status === 'completed' && data.recap_url) {
            text.textContent = 'Your recap is ready. ';
            icon.className = 'fas fa-check';
            link.href = data.recap_url;
            link.hidden = false;
            return true;
        }
        if (data.status === 'failed') {
            text.textContent = data.error || 'Recap generation failed. Please try again.';
            icon.className = 'fas fa-exclamation-triangle';
            return true;
        }
        return false;
    }
    function poll() {
        fetch('/api/ai_summary_job/' + job.id + '/', { credentials: 'same-origin' })
            .then(function (response) {
                if (!response.ok) throw new Error('Status unavailable');
                return response.json();
            })
            .then(function (data) {
                if (!update(data)) window.setTimeout(poll, 3000);
            })
            .catch(function () { window.setTimeout(poll, 4000); });
    }
    if (!update({
        status: job.status,
        error: job.error,
        recap_url: job.share_id ? '/recap/' + encodeURIComponent(job.share_id) : ''
    })) poll();
})();
</script>
{% endif %}
