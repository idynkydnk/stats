name: Check live mobile and desktop layout

on:
  push:
    branches: [codex/mobile-stats-fit]
  workflow_dispatch:
    inputs:
      candidate:
        description: 'Preview repository CSS over the live site'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install cloud browser
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps ${{ matrix.browser }}
      - name: Check live pages
        env:
          BROWSER: ${{ matrix.browser }}
          CANDIDATE: ${{ github.event_name == 'push' || inputs.candidate }}
        run: node scripts/check_live_layout.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-layout-${{ matrix.browser }}
          path: output/live-layout/
          retention-days: 7
