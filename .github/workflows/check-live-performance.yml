name: Check live navigation performance
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install cloud browser
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps ${{ matrix.browser }}
      - name: Check actual page loads and complete matchup sorting
        env:
          BROWSER: ${{ matrix.browser }}
        run: node scripts/check_live_performance.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-performance-${{ matrix.browser }}
          path: output/live-performance/
          retention-days: 7
