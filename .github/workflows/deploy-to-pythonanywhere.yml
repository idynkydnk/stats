name: Deploy to PythonAnywhere

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Check site update descriptions
      env:
        BEFORE_SHA: ${{ github.event.before }}
        AFTER_SHA: ${{ github.sha }}
      run: python3 scripts/check_site_updates.py "$BEFORE_SHA" "$AFTER_SHA"
      
    - name: Deploy to PythonAnywhere
      run: |
        # Send webhook to trigger deployment (authenticated with DEPLOY_TOKEN secret)
        echo "Calling webhook at: https://${{ secrets.PA_DOMAIN }}/deploy"
        curl --fail -X POST "https://${{ secrets.PA_DOMAIN }}/deploy" \
        -H "Content-Type: application/json" \
        -H "X-Deploy-Token: ${{ secrets.DEPLOY_TOKEN }}" \
        -d '{"ref": "refs/heads/main"}'

    - name: Verify cloud location correction
      env:
        PA_USERNAME: ${{ secrets.PA_USERNAME }}
        PA_API_TOKEN: ${{ secrets.PA_API_TOKEN }}
        EXPECTED_REVISION: ${{ github.sha }}
        BEFORE_SHA: ${{ github.event.before }}
      run: |
        if git diff --name-only "$BEFORE_SHA" HEAD | grep -q '^migrations/normalize_tyler_entered_locations.py$'; then
          curl --fail --silent --show-error "https://${{ secrets.PA_DOMAIN }}/locations/" --output /dev/null
          python3 scripts/verify_tyler_locations_cloud.py
        fi
        
    - name: Verify John Moran player correction
      env:
        PA_USERNAME: ${{ secrets.PA_USERNAME }}
        PA_API_TOKEN: ${{ secrets.PA_API_TOKEN }}
        BEFORE_SHA: ${{ github.event.before }}
      run: |
        if git diff --name-only "$BEFORE_SHA" HEAD | grep -q '^migrations/correct_john_russian_max.py$'; then
          curl --fail --silent --show-error "https://${{ secrets.PA_DOMAIN }}/api/doubles/games?since=2026-10-09" --output /dev/null
          python3 scripts/verify_john_max_cloud.py
        fi

    - name: Notify deployment success
      if: success()
      run: echo "✅ Successfully deployed to PythonAnywhere!"
      
    - name: Notify deployment failure
      if: failure()
      run: echo "❌ Deployment failed. Check the logs above."
